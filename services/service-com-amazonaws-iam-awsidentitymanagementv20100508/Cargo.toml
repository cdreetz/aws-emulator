[package]
name = "service-com-amazonaws-iam-awsidentitymanagementv20100508"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ocw-clock = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Reads a SAML provider's metadata document (`CreateSAMLProvider$SAMLMetadataDocument`).
roxmltree = "0.20"
# `service-common` carries the ONE reading of the UTC offset an RFC 3339 / `xs:dateTime`
# timestamp declares, which the metadata document's `validUntil` is read through.
service-common = { path = "../common" }
tracing = { workspace = true }
# Reads the X.509 certificate an `UploadServerCertificate` request carries: the instant it
# expires, and whether the body is a certificate at all.
x509-cert = "0.2"
# Reads the PEM framing and PKCS#8 structure of the private key that upload carries, so an
# encrypted or foreign key is refused rather than stored.
pkcs8 = { version = "0.10", features = ["pem", "std"] }
# The PKCS#1 RSA key structures, for matching an uploaded private key with the public key
# in its certificate, and for reading the RSA public key an `UploadSSHPublicKey` body
# carries in either of the PEM structures a public key is written in.
pkcs1 = { version = "0.7", features = ["pem", "pkcs8"] }
# Hashes the DER public key of an uploaded SSH public key into the MD5 fingerprint
# `SSHPublicKey$Fingerprint` carries.
md-5 = "0.10"
# Reads the OpenSSH public key line an `UploadSSHPublicKey` body may carry, so what counts
# as a key is the format itself rather than the shape of the text.
ssh-key = { version = "0.6", default-features = false, features = ["alloc"] }
# The SEC1 elliptic-curve private key structure, for that same match on an EC key pair.
sec1 = "0.7"
# Encodes the `otpauth://` URI of a virtual MFA device as the QR code
# `CreateVirtualMFADevice` answers with (`VirtualMFADevice$QRCodePNG`).
qrcode = { version = "0.14", default-features = false }
# Writes that QR code as the PNG image the same member carries.
png = "0.18"
# Spells a minted virtual MFA device seed in base32, "as specified in RFC3548"
# (`VirtualMFADevice$Base32StringSeed`).
data-encoding = "2"
# Hashes a console password into the salted verifier the account holds in place of it, so
# `ChangePassword` can check the caller's current password without the password being kept.
sha2 = { workspace = true }
# Writes the account's credential report as the `text/csv` artifact `GetCredentialReport`
# serves, so the quoting of a cell is RFC 4180's and not hand-rolled.
csv = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# Generates the real certificates and key pairs the server-certificate tests feed the
# service, independently of the DER this crate reads.
rcgen = "0.13"

[lints]
workspace = true
