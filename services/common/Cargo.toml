[package]
name = "service-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ocw-clock = { workspace = true }
# `iam_client`: the in-process IAM client a service resolving a caller-supplied IAM
# entity asks, built once here instead of per service.
aws-sdk-iam = { version = "1", default-features = false }
# `eventbridge_client`: the in-process EventBridge client a service publishing an event
# drives — the management-event fan-out (`api_call_events`) among them — built once here
# for every service that publishes. Only the generated client is needed: the emulator
# supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `api_call_events`: a publication that could not be made is traced rather than failing the
# call it belongs to, so that path needs the workspace's logging facade.
tracing = { workspace = true }
# `api_gateway_access_logs`: the in-process CloudWatch Logs client an API Gateway stage
# writes its access-log records through, built once here for both API Gateway planes. Only
# the generated client is needed: the emulator supplies the transport, so the SDK's own
# HTTPS stack is left out.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# `s3_client`: the in-process Amazon S3 client a service DELIVERING an object into a bucket
# a client named writes through — a logging trail's log files (`trail_log_files`) among
# them — built once here for every service that writes one. Only the generated client is
# needed: the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false }
# `sns_client`: the in-process Amazon SNS client a service PUBLISHING a notification to a
# topic a client named drives — the terminal status of an asynchronous task among them —
# built once here for every service that publishes. Only the generated client is needed: the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-sns = { version = "1", default-features = false }
# `trail_log_files`: a CloudTrail log file IS a gzip stream, so it is written with the
# maintained DEFLATE implementation this workspace already compresses with rather than by
# laying out the framing here.
flate2 = "1"
# `trail_log_files`: the UTC calendar fields a log file's key is laid out by (the year,
# month and day of its prefix and the minute in its name), from the maintained calendar
# crate rather than by slicing a rendered timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `xray_segments`: the in-process X-Ray client a service REPORTS its own segments through —
# the API Gateway stage that served a traced request, the Lambda invocation it reached — built
# once here for every producer. Only the generated client is needed: the emulator supplies the
# transport, so the SDK's own HTTPS stack is left out.
aws-sdk-xray = { version = "1", default-features = false }
# `kinesis_client`: the in-process Kinesis client a service DELIVERING a data record
# writes through, built once here for the same reason. Only the generated client is
# needed — the emulator supplies the transport, so the SDK's own HTTPS stack and runtime
# are left out and the client can reach nothing off this process.
aws-sdk-kinesis = { version = "1", default-features = false }
# `dynamodb_stream_event`: the record TYPE a DynamoDB stream's data plane answers, which
# the envelope rendered there is built from — taken from the SDK rather than re-declared,
# for the same reason and with the same features left out.
aws-sdk-dynamodbstreams = { version = "1", default-features = false }
# `resolve_route_key` / `ROOT_PATH_SEGMENT`: the framework's own routing-key rule,
# which this crate narrows rather than replaces.
emulator-server = { workspace = true }
http = { workspace = true }
# `front_door`: the operation wrapper, the schema it reads a member's HTTP binding
# off, the constraint walk it runs and the request/response types it serves.
# `event_stream` is driven through the same traits.
# `validation`: the same `Schema` / `ShapeSerializer` seam, used to re-walk a built
# input, and the `Violation` / constraint-path vocabulary the framework's own
# constraint walk reports in. `shared_path`: `percent_decode`, which it reads a
# percent-encoded URI path label through. `claims_modeled_route`:
# `ErasedServiceDefinition`, which it asks whether a service's own generated route table
# binds a route for the request, and the empty `SdkBody` the request it hands that
# service's protocol carries.
smithy-server-runtime = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
# `validation`: the leaf types a `ShapeSerializer` is handed.
# `addresses_modeled_route`: the empty body the request it asks a service's own protocol
# to route is built with (that routing key reads the method, URI and headers only).
aws-smithy-types = { workspace = true }
# `stable_hex_id`'s mixing function: a maintained digest, so a derived id that travels on
# the wire is reproducible across builds rather than tied to the algorithm `std`'s default
# hasher happens to use.
sha2 = { workspace = true }
# `iam_trust_policy`: an IAM trust policy IS a JSON document, so it is read with a
# maintained JSON parser rather than by hand.
serde_json = { workspace = true }
# `submitted_collections`: reads the ORDER a request's JSON object wrote a map member's
# entries in, which the built input (a `HashMap`) does not keep. Only the deserializer
# seam is used; no shape here derives `Serialize`.
serde = { workspace = true }
# `query_error_envelope`: the v4 UUID an awsQuery error envelope reports as its
# `<RequestId>`, from the maintained crate the framework's own request-id minter and the
# service-local copies of that writer use, rather than derived here.
# `management_events`: the `eventID` / `requestID` a recorded event carries are version-4
# UUIDs, minted by the same maintained crate rather than by laying the form out here.
uuid = { version = "1", features = ["v4"] }
# `in_band_tls`: the async read/write traits a data-plane connection is read through
# (`io-util`'s `AsyncReadExt` for the one sniffed byte, and the `AsyncRead`/`AsyncWrite`
# the replaying stream implements), for a plane whose encryption is negotiated in band.
tokio = { workspace = true, features = ["io-util"] }
# `iam_authorization`: the reading of an IP address or a range in CIDR notation that the
# IAM `IpAddress`/`NotIpAddress` condition operators compare an address against, taken from
# the maintained crate rather than by splitting the notation by hand.
ipnet = "2"
# `iso8601_span`: the ISO 8601 duration grammar, parsed by the maintained crate rather
# than by hand, for every service handed a span as a caller-supplied string.
iso8601-duration = "0.2"
# `json_reference_path`: the maintained RFC 9535 JSONPath engine, which EVALUATES the
# reference path that module accepts — so a caller-supplied path is not interpreted here.
# The module bounds the path's length, its segment count and its selectors before the
# engine is handed anything, and hands it the module's own canonical rendering.
serde_json_path = "0.7"
# `jwt`: the JOSE primitives every service handed a JWS needs — the signature check
# against the key a token's issuer published or an ACME client embedded (ECDSA, RSASSA
# PKCS1-v1_5 and Ed25519, RFC 7518 section 3.1), the HMAC of RFC 7518 section 3.2, and the
# digest the RFC 7638 thumbprint of a public key is. An in-process COMPUTATION over data:
# it opens no listener, spawns nothing and reads nothing off the host. It is the
# cryptography library this workspace already signs those tokens with (the user-pool
# service), so it is already in this workspace's build and lockfile and no capability class
# arrives with this declaration — and no second implementation of the primitive is written.
# Not a pure-Rust elliptic-curve stack, whose `crypto-bigint` this repository's dependency
# audit blocks (RUSTSEC-2026-0387).
ring = "0.17"
# `in_process_sigv4`: the SigV4 signer a service signs an in-process call to another
# emulated service with — the SDK's own signer, which is what the emulator's verifier
# re-signs with, rather than a second implementation of the signature.
aws-sigv4 = { workspace = true }
# The signing identity `aws-sigv4` takes, built from the credential the framework hands
# every handler.
aws-credential-types = { workspace = true }
# `jsonata`: the JSONata interpreter the services whose API carries a caller-written
# JSONata expression evaluate it with — the Amazon States Language's JSONata mode
# today, and the B2BI mapping template once its own containment of the same engine
# moves here — so the engine is reached through one bounded seam rather than per
# service. An execution substrate, which is why that module states and enforces the
# ceilings that confine it; `default-features = false`, since nothing it turns on by
# default is needed. Pinned EXACTLY: the parse shapes the module reads a refused
# construct off are this version's.
jsonata-rs = { version = "=0.3.4", default-features = false }
# `injected_api_faults`: the per-call draw that decides whether a call falls in the share a
# fault-injection action affects, taken from the maintained generator rather than from a
# counter kept across calls.
rand = "0.9"
# The arena `jsonata-rs` allocates its parsed expression and its values into: one per
# evaluation, dropped with it. Pinned EXACTLY for the same reason — the memory ceiling of
# an evaluation is enforced through this crate's allocation limit.
bumpalo = "=3.20.3"
# `feature_store_offline_store`: the caller-supplied Amazon S3 URI a feature group's offline
# store is configured with is read by the maintained URL parser rather than split by hand.
url = "2"
# `posix_shell_session`: the POSIX/bash TOKENIZER AND GRAMMAR every service that performs
# caller-supplied shell text reads it with. The PARSER only: it is a library that computes
# over data in process — it builds a syntax tree and runs nothing, opens nothing and reaches
# nothing — so what PERFORMS a program is that module's own session, whose catalog of
# session-local utilities (output, status, variables), bounds and fail-closed default are
# stated there. Its EXECUTING half, `brush-core`, is deliberately NOT taken: an engine
# resolves a command against the host's `PATH`, starts a host process for it and opens the
# host files a redirection names, with no seam to confine any of that, so taking it would
# hand a caller's program the host. It compiles no C and the tree it locks carries no
# advisory (it is already in this workspace's lock file, for the Amazon ECS crate, whose own
# copy of that session is to be migrated onto this module); its `peg` dependency is a
# procedural macro, so that part of it runs on the BUILDER's machine at build time, as every
# macro in this workspace does.
brush-parser = { version = "0.4", default-features = false }
# ... and the path of that URI spells an Amazon S3 key, so its percent-escaping is resolved
# by the maintained encoder the URL parser itself uses.
percent-encoding = "2"

[lints]
workspace = true
