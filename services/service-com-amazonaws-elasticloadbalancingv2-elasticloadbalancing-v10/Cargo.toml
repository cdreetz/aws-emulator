[package]
name = "service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ocw-clock = { workspace = true }
engine = { workspace = true }
# `service-common` carries two readers this crate needs.
# `arn`: the ONE parse of a caller-supplied resource ARN (the six fields, the vendor and
# the resource field), which this service reads every ARN a tagging call names through to
# decide which kind of resource it addresses.
# `query_error_envelope`: the `<RequestId>` element an awsQuery `<ErrorResponse>` carries
# beside its `<Error>`, which no model declares and the framework's error renderers do not
# write. Shared with the Classic Elastic Load Balancing crate, which serves this model on
# the endpoint the two share, so one endpoint cannot answer two envelopes.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands a load balancer's own socket, which
# is what makes the published `DNSName` an address a client dials with its own client
# (`src/service/listener_socket.rs`). `hyper-util` carries the tokio IO and timer adapters
# for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Runs the SERVER side of the TLS handshake an HTTPS or TLS listener terminates, under the
# certificate Certificate Manager holds for that listener: the core's own TLS server
# presents the emulator's certificate and takes no other, so a listener that must present
# the ACCOUNT's leaf and chain runs the handshake itself (`src/service/listener_socket.rs`).
# `rustls-pemfile` reads that PEM material into the DER the handshake needs, and
# `tokio-rustls` drives it over the connection the core handed in. The versions this
# workspace already builds.
rustls = { workspace = true }
rustls-pemfile = "2"
tokio-rustls = "0.26"
# Decodes the DER inside one PEM block of a trust store's CA certificates bundle as an X.509
# certificate, which is what makes `TrustStore$NumberOfCaCertificates` a count of
# certificates a parser accepted rather than of markers in the text
# (`src/state/ca_certificates_bundle.rs`). The PEM framing is read by `rustls-pemfile`
# above; this reads the certificate inside it.
x509-cert = "0.2"
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the account's subnets, VPCs, security groups and
# instances are EC2's resources, so `CreateLoadBalancer` and `RegisterTargets` resolve the
# ones a request names against EC2 (`src/state/network.rs`) rather than assuming them.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The ONE reading of an IPv4/IPv6 CIDR block and of whether an address is inside it, which
# is how an `ip` target is matched against the subnets and the VPC of its target group.
ipnet = "2"
# The DRAW one request of a weighted `forward` action is distributed by: each target group of
# the action receives the share of requests its `Weight` gives it, so which group a single
# request reaches is a sample of the unit interval rather than a position in a rotation
# nothing may store (`src/service/target_group_selection.rs`).
rand = "0.9"
# The digest the target-group stickiness cookie carries instead of the chosen group's ARN, so
# the pin names the group to this service and nothing of the account's naming to the client
# (`src/service/target_group_selection.rs`).
sha2 = { workspace = true }
# The rendering of an authenticated page marker's bytes as the opaque string a paginated
# read hands back in `NextMarker` (`src/state/pagination.rs`).
hex = { workspace = true }
# The WAFv2 web ACL in front of a load balancer, and the evaluation of it: a web ACL is
# associated with an Application Load Balancer through `AssociateWebACL`, so the records
# and the semantics are that service's, and the data plane here asks it for the decision
# rather than keeping a second reading of a rule tree (`service::web_acl`).
service-com-amazonaws-wafv2-awswaf-20190729 = { workspace = true }
# The AWS SDK for Lambda, driven over the in-process callback
# (`OperationContext::callback`): a `forward` to a `lambda` target group is served by
# INVOKING the function the registration names, so the data plane calls Lambda's own
# `Invoke` through this emulator rather than inventing an answer for it
# (`src/service/lambda_target.rs`). Only the generated client is needed — the emulator
# supplies the transport.
aws-sdk-lambda = { version = "1", default-features = false }
# The CloudWatch metric store, which is where the host-count series a load balancer
# publishes for the target groups it routes to LIVES: those datapoints are read back through
# `GetMetricStatistics` / `GetMetricData` / `ListMetrics` and graded by CloudWatch's own alarm
# evaluation, so they are appended to that service's own store rather than kept in a second
# copy no reader reads (`src/state/host_counts.rs`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The account's EC2 inventory, for the two facts this service WRITES to and READS from it
# rather than resolving per request: the elastic network interfaces a load balancer holds in
# its subnets (`src/state/service_interfaces.rs`), and whether anything of the account stands
# behind a registered target, which is what one health check can observe
# (`src/state/host_counts.rs`). Both run off a clock with no request to carry a callback, so
# they reach that service's own store on the shared engine.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The HTTPS-listener suite dials the address a load balancer publishes, in this process,
# exactly as a client handed that name does: `rcgen` mints the real leaf and key a client
# imports into Certificate Manager, and the Certificate Manager service is mounted beside
# this one on the same engine so the certificate the listener presents is one a client
# really imported (`tests/all/alb_https_listener_tls.rs`). The client half of the handshake
# runs on the `rustls`/`tokio-rustls` this crate already builds. TEST-ONLY.
rcgen = "0.13"
service-com-amazonaws-acm-certificatemanager = { workspace = true }
# `ByteMatchStatement$SearchString` is a blob, which travels base64-encoded in the
# awsJson1_1 body `tests/all/web_acl_enforcement.rs` writes a web ACL's rules with — the
# same coder the WAFv2 crate decodes it with.
base64 = "0.22"
# The Classic Elastic Load Balancing service, which owns the shared `elasticloadbalancing`
# routing key both APIs are published on: `tests/all/shared_endpoint_routing.rs` drives
# this model through that front door, the way an AWS SDK ELBv2 client reaches it.
# DEV-ONLY and deliberate: that crate takes this one as a normal dependency (it mounts this
# model behind its front door), so the cycle closes through a dev-dependency, which Cargo
# allows. Do not "fix" it by moving the front door.
service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7 = { workspace = true }
# A `forward` to a `lambda` target group invokes the registered function, and what the client
# is answered with is what the function's own run returned, so Lambda is mounted beside this
# service on the suite's own engine and every function a case registers is created through
# Lambda's OWN API (`tests/all/alb_lambda_target.rs`).
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# That function reports every invocation to a queue through its own SDK, and the suite reads
# the report back where a client reads it — off the queue, through Amazon SQS's own API — so
# a row answered without the handler having run fails.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The .zip deployment package such a function is created from, written in memory the way a
# caller uploads one — the same reader/writer the Lambda crate's own invoke suites use.
zip = { version = "9", default-features = false, features = ["deflate"] }
# A trust store is built from an object Amazon S3 holds, so the object store is MOUNTED
# beside this service on the suite's own engine and every CA certificates bundle a case
# names is staged through Amazon S3's own `PutObject` — the very seam the handler reads it
# over (`tests/all/trust_store_lifecycle.rs`).
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The client that staging goes through, built by the one shared constructor
# (`service_common::s3_client`): only the generated client is needed, the emulator supplies
# the transport.
aws-sdk-s3 = { version = "1", default-features = false }

[lints]
workspace = true
