[package]
name = "service-com-amazonaws-ec2-amazonec2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ocw-clock = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a `NextToken` this service did not mint
# detectable, which is what lets a paginating describe refuse a malformed one.
hex = { workspace = true }
# JPEG codec for the instance console screen `GetConsoleScreenshot` reports: the
# operation documents its image as a JPG, so the bytes have to be one.
jpeg-encoder = "0.6"
# The 8x8 monochrome console font that screen's text is drawn with.
font8x8 = "0.3"
# `GetConsoleScreenshotResult$ImageData` carries the image as base64 text, and the body of
# the armoured public key file an import may carry is base64 too.
base64 = "0.22"
# The 2048-bit RSA key pair `CreateKeyPair` generates: the operation hands the caller the
# private half, so the key has to be a real key.
aws-lc-rs = "1"
# The PKCS#1 `RSAPrivateKey` an RSA key pair's PEM private key is ("an unencrypted PEM
# encoded PKCS#1 private key"), read out of the PKCS#8 `aws-lc-rs` encodes a key as; its
# `pkcs8` feature carries the `rsaEncryption` algorithm identifier an imported RSA public
# key's DER `SubjectPublicKeyInfo` is written under.
pkcs1 = { version = "0.7", features = ["pem", "pkcs8"] }
# Reads that PKCS#8 structure, whose `privateKey` IS the PKCS#1 one.
pkcs8 = "0.10"
# The `SubjectPublicKeyInfo` an imported RSA public key's fingerprint is taken over
# (RFC 5280).
spki = { version = "0.7", default-features = false, features = ["alloc"] }
# The SHA-1 digest an RSA key pair's fingerprint is (`KeyPair$KeyFingerprint`).
sha1 = "0.10"
# The MD5 digest an IMPORTED RSA key pair's fingerprint is instead ("the MD5 public key
# fingerprint as specified in section 4 of RFC4716", `KeyPairInfo$KeyFingerprint`).
md-5 = "0.10"
# The OpenSSH key formats: an Ed25519 key pair, the PEM private key and the one-line public
# key OpenSSH writes for one, the base64 SHA-256 fingerprint it prints for it, and the
# public key an `ImportKeyPair` carries.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# The SSH wire encoding of a key's own components, which the PuTTY private key file a
# `ppk` key format asks for is built out of.
ssh-encoding = { version = "0.2", features = ["alloc"] }
# The keyed digest that file's integrity line carries.
hmac = "0.12"
# The civil-calendar arithmetic the Athena integration template's daily partitions are laid
# out on: the days a partition range covers, and their year/month/day prefixes.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The shared XML rendering of a floating-point member, which AWS writes as a decimal
# carrying a fractional part where Rust's own rendering drops it, and the ONE
# evaluation of IAM policy documents the authorization gate decides a request with.
service-common = { path = "../common" }
# The EBS DIRECT APIs and EC2 describe ONE snapshot resource: a snapshot `ebs:StartSnapshot`
# minted is read back through `ec2:DescribeSnapshots`, so this service reads THAT service's
# own state accessor rather than keeping a second copy of its snapshots.
service-com-amazonaws-ebs-ebs = { workspace = true }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: the authorization gate
# reads both services' OWN state accessors rather than keeping a second copy of
# either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The import tests build the public key material they send and read the base64 digest an
# ED25519 import's fingerprint carries.
base64 = "0.22"
# The import tests compute the expected MD5 fingerprint of an imported RSA key over a DER
# `SubjectPublicKeyInfo` they write by hand, so the value is cross-checked against the
# standard rather than against the handler's own encoder.
md-5 = "0.10"
# The integration tests wait out a clock-owed transition with `tokio::time::sleep`,
# which needs the timer driver on top of the workspace's tokio features.
tokio = { workspace = true, features = ["time"] }
# Reads the ec2Query XML responses the integration tests assert on.
roxmltree = "0.20"
# Decoder used only by the tests, to prove the console screenshot really decodes
# as a JPEG of the screen geometry the handler reports.
zune-jpeg = "0.4"

[lints]
workspace = true
