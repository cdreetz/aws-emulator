[package]
name = "service-com-amazonaws-eks-awswesleyfrontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ocw-clock = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives each cluster's stable 32-hex resource id (endpoint host, OIDC issuer)
# from its ARN, in `src/state.rs`.
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `RegisterCluster` and `CreateCapability` verify
# with `GetRole` that the role they are given exists and lets the service
# principal that would use it assume it. Only the generated client is needed —
# the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for EC2, over the same callback: `CreateCluster` and
# `CreateNodegroup` resolve the subnets they are given with `DescribeSubnets`
# before they provision anything, because the account's subnets are EC2's.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for CloudWatch Logs, over the same callback: a cluster whose
# `logging` enables a control plane log type exports that type's logs to the
# cluster's own log group, which is CloudWatch Logs' resource to create and write
# (`src/state/control_plane_logs.rs`).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# The session registry in the same shared engine, which is where
# `sts:GetCallerIdentity` answers from: `CreateCluster` files the cluster creator's
# bootstrap access entry under the IAM principal the request's own credential speaks
# for, so that principal is resolved through STS's OWN resolution rather than
# guessed (`src/state/cluster_creator_access.rs`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The account's IAM records in that same shared engine: the authorization decision
# every request is judged by (`src/service/authorization.rs`) reads the
# identity-based policy documents and the permissions boundary in force on the
# principal the request's credential speaks for, through IAM's own accessors.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_trust_policy`: the one reading of an IAM trust policy — including the
# decode of the URL-encoded form IAM reports a document in — shared with every
# other service that resolves a caller-supplied role.
service-common = { path = "../common" }
# An add-on's `configurationValues` document is written in JSON or in YAML, and a
# document that is neither is refused, so the add-on write operations have to know
# whether a body parses as YAML at all. yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services that read caller-supplied YAML already use.
yaml-rust2 = { version = "0.10", default-features = false }
# `ipnet`: the reading of an IPv4/IPv6 CIDR block and of whether one block contains
# another — the form of a `publicAccessCidrs` entry
# (`src/state/cluster_parameters.rs`) and the private range, netmask bounds and
# VPC overlap of a cluster's service CIDR (`src/state/cluster_validation.rs`), which
# are the same reading. The version the sibling services that read caller-supplied
# CIDRs declare it at.
ipnet = "2"
# A cluster's `certificateAuthority.data` is "the Base64-encoded certificate data
# required to communicate with your cluster", so this service issues a REAL
# self-signed X.509 certificate for every certificate authority it provisions
# (`src/state/certificate_material.rs`). rcgen is the generator this tree already
# uses for certificate material.
rcgen = "0.13"
# The validity window rcgen stamps on that certificate is the one the certificate
# authority record reports, so the two instants are converted from the record's
# `SystemTime`s into the date-time type rcgen takes.
time = { version = "0.3.55", default-features = false, features = ["std"] }

[dev-dependencies]
# The clock-owed `CREATING` -> `ACTIVE` test waits with `tokio::time::sleep`, so
# this target declares tokio's `time` feature rather than inheriting it
# transitively from another crate's feature set.
tokio = { workspace = true, features = ["time"] }
# The certificate-authority suite decodes what a cluster reports as its
# `certificateAuthority.data` and reads the X.509 certificate inside it the way a
# TLS client would, rather than matching on its text.
x509-cert = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
