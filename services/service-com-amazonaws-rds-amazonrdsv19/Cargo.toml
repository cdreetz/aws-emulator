[package]
name = "service-com-amazonaws-rds-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ocw-clock = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The DB instance DATA plane (`src/state/data_plane/`): the engine endpoint a PostgreSQL
# or MySQL client connects to.
#
# `rusqlite` (the `bundled` SQLite already in this workspace — `vendor/emulator-telemetry`
# and the Athena, Redshift Data and RDS Data services build the same version and feature
# set) is the SQL engine each instance's statements run against, in memory and per
# instance.
#
# The `backup` feature is SQLite's own online-backup API, which is what COPYING one
# instance's database is: taking a DB snapshot of an instance and restoring that snapshot
# into a new instance's storage are both a page-for-page copy made by the engine, and it is
# also how a session's transaction keeps the rows it has not committed recoverable
# (`src/state/data_plane/session_transactions.rs`). The `functions` feature registers this
# endpoint's own server functions (`pg_postmaster_start_time`, `pg_is_in_recovery`,
# `pg_sleep`, `current_setting`) on each database's connection, so a statement that calls one
# is planned and run by the engine. The `hooks` feature carries the engine's own account of
# WHICH rows a statement changed (SQLite's update hook), which is what a session's
# `ROLLBACK` puts back.
#
# PINNED at 0.41, the release reviewed and built here: it is the first one whose
# `libsqlite3-sys` (0.39) carries a SQLite C library without RUSTSEC-2026-0459 (a
# page-cache disclosure through an undersized-page WAL file, fixed in SQLite 3.54.0),
# which 0.37's `libsqlite3-sys` 0.35 shipped. The two components 0.41 adds —
# `sqlite-wasm-rs` and its `rsqlite-vfs` — are gated to `wasm32` upstream and are not
# linked into a host build, so the engine in the process is still one bundled SQLite.
# The linked release is asserted against that floor by the engine-release suite of
# `services/service-com-amazonaws-rdsdata-rdsdataservice`.
rusqlite = { version = "0.41", features = [
    "backup",
    "bundled",
    "column_decltype",
    "functions",
    "hooks",
    "limits",
] }
# `sqlparser` reads a statement as the TOKENS of its own dialect, which is how the wire
# tells a server command (`SHOW`, `SET`) from a query and substitutes the session's values
# into one without inspecting its text. The `visitor` feature walks a statement's PARSE,
# which is how the exact-decimal arithmetic below is put in its place without matching on
# the statement's text (`src/state/data_plane/pg_numeric.rs`).
sqlparser = { version = "0.59", features = ["visitor"] }
# `bigdecimal` is the arbitrary-precision DECIMAL the engines' `numeric` type is
# (`src/state/data_plane/pg_numeric.rs`): "calculations with numeric values yield exact
# results where possible", which a binary floating-point type cannot, so the arithmetic over
# a value cast to `numeric` is computed on its digits by this crate. Already in this
# workspace's lock file.
bigdecimal = "0.4"
# `sha1` is the digest the MySQL `mysql_native_password` handshake is defined in terms of,
# and the only form a native-password login can be verified against.
sha1 = "0.10"
# `md-5` is the digest the engines' own `md5()` function computes
# (`src/state/data_plane/sql_engine.rs`), which a client calls to checksum the rows it
# loaded. The RustCrypto implementation, the same family as `sha1` and `sha2` above.
md-5 = "0.10"
# `getrandom` draws the per-connection nonce that handshake challenges a client with from
# the operating system's own entropy, so the proof the client answers with cannot be
# replayed.
getrandom = "0.3"
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the subnets a `CreateDBSubnetGroup` names are EC2's
# resources, so `src/state/ec2_subnets.rs` asks EC2 which Availability Zone each one lies
# in rather than deciding it here. Only the generated client is needed — the emulator
# supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# `rds_cluster_parameters`: the cluster parameter catalog and the parameter rules the
# Amazon RDS, DocumentDB and Neptune models of the one `rds` front door share
# (`src/state.rs`).
# `db_data_sources`: the shared directory a minted `DbiResourceId` is recorded in, so a
# monitoring service (Performance Insights) can tell which service owns that id.
# `audited_operation` / `management_events`: the shared operation wrapper that records each
# call this front door serves in the account's management-event log, and the log itself —
# the one store CloudTrail's `LookupEvents` reads (`src/service/management_events.rs`).
# `query_decimal_floats`: the wrapper that renders a floating-point member of a response as
# the decimal AWS renders one as, which every operation of this front door is served behind
# (`src/service/management_events.rs`).
service-common = { path = "../common" }
# `ManageMasterUserPassword` has RDS generate the master user password and manage it in
# Amazon Web Services Secrets Manager: this is the Secrets Manager client the create and
# the rotation of that secret go out over the in-process callback with
# (`src/state/managed_master_secret.rs`).
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The same module reports WHICH KMS key that secret is encrypted under, resolved through
# KMS so the key's own ARN is reported rather than an alias that may be re-targeted.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `state::new_request_id`'s digest: a maintained hash, so the per-response request id in
# an awsQuery `<ErrorResponse>` envelope is shaped by library code rather than by hand.
sha2 = { workspace = true }
hex = { workspace = true }
# `StartExportTask` writes the exported snapshot or cluster data INTO the one object store
# this emulator serves, where the caller then lists and reads it: the export objects are
# recorded through Amazon S3's own store on the same engine (`src/state/export_objects.rs`),
# so a bucket this service writes to is a bucket that service holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# An event subscription's delivery target is an Amazon SNS topic, and a subscription is
# refused when that topic does not exist, so the topic is resolved against the service that
# OWNS topics: this is the Amazon SNS client that question goes out over the in-process
# callback with (`src/state/sns_topics.rs`), exactly as the EC2 client above resolves a
# subnet. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-sns = { version = "1", default-features = false }
# The export writes each table as the Apache Parquet file Amazon RDS exports a snapshot as
# ("the data is exported in Apache Parquet format", Exporting DB snapshot data to Amazon S3):
# `parquet` is the Apache implementation of that format, used through its low-level row-group
# writer, and `flate2-rust_backend` is the one compression feature it needs for the
# GZIP-compressed columns those `.gz.parquet` objects carry — the pure-Rust backend, so no
# native zlib is built. Nothing else of the crate is built — in particular no Arrow, and no
# `thrift` (this release line reads the format's metadata with its own code, so the advisory
# against `thrift` before 0.23 does not reach this build).
parquet = { version = "60", default-features = false, features = ["flate2-rust_backend"] }
# The AUTHENTICATION TOKEN an IAM-authenticated engine login presents as its password
# (`src/state/data_plane/iam_auth_token.rs`) is a presigned request: `form_urlencoded` reads
# its query fields, and `chrono` reads the basic ISO 8601 instant SigV4 signs it at, so
# neither a query string nor a calendar is parsed by hand. Both are already in this
# workspace's lock file.
# The records a `LOAD DATA FROM S3` loads are read out of the S3 object's bytes by `csv`,
# configured from the statement's own `FIELDS`/`LINES` clauses (the delimiter, the enclosing
# character, the line terminator), so the delimited-text format is read by library code
# rather than split by hand (`src/state/data_plane/mysql_s3_load.rs`).
csv = "1"
form_urlencoded = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The EC2 service, mounted beside this one in the test harness: that a DB subnet group
# reports the zones of the subnets a client minted with `ec2:CreateSubnet` can only be
# driven end to end with the owner of subnets on the same engine. DEV-ONLY: this crate
# depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The engine-endpoint tests drive a real client against the data plane in ONE process:
# `sha1` computes the `mysql_native_password` proof a client sends, and
# `rustls`/`tokio-rustls` run the client side of the in-band TLS upgrade the core's
# upgrader answers. Both are the versions this workspace already builds.
sha1 = "0.10"
rustls = { workspace = true }
tokio-rustls = "0.26"
# The RDS/S3 integration suite mounts Amazon S3 and IAM beside this service on one engine,
# exactly as the assembled router mounts them, and reads the objects an export wrote back
# through Amazon S3's OWN operations: `aws-sdk-s3` and `aws-sdk-iam` are those clients, over
# the in-process callback.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The managed-master-password suite mounts Secrets Manager (and KMS, which encrypts a
# secret's value) beside this service on one engine, exactly as the assembled router
# mounts them, so the secret a cluster or instance reports is a real secret of this
# emulator, read back through Secrets Manager's own operations.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }
# The event-subscription suite mounts Amazon SNS beside this service on one engine, exactly as
# the assembled router mounts it, so the topic a subscription delivers to is a real topic of
# this emulator, created through Amazon SNS's own `CreateTopic`.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }

[lints]
workspace = true
